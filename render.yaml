services:
  # Backend service
  - type: web
    name: nestfy-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        fromService:
          type: web
          name: nestfy-frontend
          property: host

  # Frontend service
  - type: web
    name: nestfy-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nestfy-backend
          property: host
