services:
  # Backend service
  - type: web
    name: nestfy-2
    env: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        value: https://nestfy-1.vercel.app
